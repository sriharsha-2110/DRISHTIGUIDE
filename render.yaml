services:
  # 1. FastAPI AI Backend Web Service
  - type: web
    name: drishti-ai-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt || pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MODEL_PATH
        value: yolov8n.pt
      - key: CONFIDENCE_THRESHOLD
        value: 0.45

  # 2. React Vite Frontend Static Site
  - type: web
    name: drishti-ai-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: drishti-ai-backend
          property: host
