services:
  - type: web
    name: drishtiguide-ai-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MODEL_PATH
        value: yolov8n.pt
      - key: CONFIDENCE_THRESHOLD
        value: 0.45
